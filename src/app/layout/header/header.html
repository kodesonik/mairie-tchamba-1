<header class="bg-white shadow-md fixed w-full z-50">
  <div class="container mx-auto px-4 py-3 flex justify-between items-center">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-3">
      <img src="assets/logo.jpg" alt="Mairie de Tchamba" class="h-12 w-auto object-contain rounded-full">
      <div class="flex flex-col">
        <span class="text-tchamba-green font-bold text-lg leading-tight uppercase tracking-wide">Mairie de Tchamba
          1</span>
        <span class="text-xs text-gray-500 font-medium">République Togolaise</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center gap-8">
      <a routerLink="/" routerLinkActive="text-tchamba-green font-semibold" [routerLinkActiveOptions]="{exact: true}"
        class="text-gray-700 hover:text-tchamba-green transition-colors text-sm uppercase tracking-wider">Accueil</a>
      <a routerLink="/mairie" routerLinkActive="text-tchamba-green font-semibold"
        class="text-gray-700 hover:text-tchamba-green transition-colors text-sm uppercase tracking-wider">La Mairie</a>
      <a routerLink="/services" routerLinkActive="text-tchamba-green font-semibold"
        class="text-gray-700 hover:text-tchamba-green transition-colors text-sm uppercase tracking-wider">Services</a>
      <a routerLink="/projets" routerLinkActive="text-tchamba-green font-semibold"
        class="text-gray-700 hover:text-tchamba-green transition-colors text-sm uppercase tracking-wider">Projets</a>
      <a routerLink="/tourisme" routerLinkActive="text-tchamba-green font-semibold"
        class="text-gray-700 hover:text-tchamba-green transition-colors text-sm uppercase tracking-wider">Tourisme</a>
      <a routerLink="/blog" routerLinkActive="text-tchamba-green font-semibold"
        class="text-gray-700 hover:text-tchamba-green transition-colors text-sm uppercase tracking-wider">Actualités</a>
      <a routerLink="/contact" routerLinkActive="bg-tchamba-green text-white"
        class="px-5 py-2 border border-tchamba-green text-tchamba-green hover:bg-tchamba-green hover:text-white rounded-full transition-all text-sm font-medium uppercase">Contact</a>
    </nav>

    <!-- Mobile Menu Button -->
    <button (click)="toggleMenu()" class="md:hidden text-gray-700 hover:text-tchamba-green focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16" />
        <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMenuOpen"
    class="md:hidden bg-white border-t border-gray-100 absolute w-full left-0 shadow-lg animate-fade-in-down">
    <div class="container mx-auto px-4 py-4 flex flex-col gap-4">
      <a routerLink="/" (click)="toggleMenu()" routerLinkActive="text-tchamba-green font-semibold"
        [routerLinkActiveOptions]="{exact: true}" class="text-gray-700 hover:bg-gray-50 p-2 rounded block">Accueil</a>
      <a routerLink="/mairie" (click)="toggleMenu()" routerLinkActive="text-tchamba-green font-semibold"
        class="text-gray-700 hover:bg-gray-50 p-2 rounded block">La Mairie</a>
      <a routerLink="/services" (click)="toggleMenu()" routerLinkActive="text-tchamba-green font-semibold"
        class="text-gray-700 hover:bg-gray-50 p-2 rounded block">Services</a>
      <a routerLink="/tourisme" (click)="toggleMenu()" routerLinkActive="text-tchamba-green font-semibold"
        class="text-gray-700 hover:bg-gray-50 p-2 rounded block">Tourisme</a>
      <a routerLink="/projets" (click)="toggleMenu()" routerLinkActive="text-tchamba-green font-semibold"
        class="text-gray-700 hover:bg-gray-50 p-2 rounded block">Projets</a>
      <a routerLink="/blog" (click)="toggleMenu()" routerLinkActive="text-tchamba-green font-semibold"
        class="text-gray-700 hover:bg-gray-50 p-2 rounded block">Actualités</a>
      <a routerLink="/contact" (click)="toggleMenu()" routerLinkActive="bg-tchamba-green text-white"
        class="block w-full text-center px-4 py-3 bg-gray-100 text-tchamba-green font-bold rounded hover:bg-tchamba-green hover:text-white transition-colors">Contact</a>
    </div>
  </div>
</header>
